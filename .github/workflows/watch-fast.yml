name: watch-jobs-fast

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-jobs-fast
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check for new postings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH57_DESCRIPTIONS_ENABLED: ${{ vars.SEARCH57_DESCRIPTIONS_ENABLED }}
        run: python check_jobs.py --tier fast

      - name: Hand off transient listing descriptions
        if: always() && vars.SEARCH57_DESCRIPTIONS_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: description-listings-fast
          path: .runtime/listings_fast.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_fast.json
          if [[ -f pending_fast.json ]]; then git add pending_fast.json; fi
          git diff --staged --quiet || git commit -m "state: fast tier update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
