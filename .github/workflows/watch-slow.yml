name: watch-jobs-slow

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-jobs-slow
  cancel-in-progress: false
  queue: max

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check for new postings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH57_DESCRIPTIONS_ENABLED: ${{ vars.SEARCH57_DESCRIPTIONS_ENABLED }}
        run: python check_jobs.py --tier slow

      - name: Hand off transient listing descriptions
        if: always() && vars.SEARCH57_DESCRIPTIONS_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: description-listings-slow
          path: .runtime/listings_slow.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: python persist_watcher_state.py --tier slow
      - name: Retain pending metadata for failed-push recovery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pending-recovery-slow-${{ github.run_id }}
          path: pending_slow.json
          retention-days: 1
          if-no-files-found: ignore
